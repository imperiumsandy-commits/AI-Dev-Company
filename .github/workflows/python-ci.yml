name: AI-Dev-Company CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.12 Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile all Python packages and tests
        run: |
          python -m compileall -q ai_dev_company
          python -m compileall -q company_os
          python -m compileall -q tests

      - name: Run automated tests
        run: |
          python -m pytest -q --junitxml=test-results.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14
